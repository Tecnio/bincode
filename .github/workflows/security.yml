{
  "name": "Security audit",
  "on": {
    "schedule": [
      {
        "cron": "0 0 * * *"
      }
    ],
    "push": {
      "paths": [
        "**/Cargo.toml",
        "**/Cargo.lock",
        ".cargo/audit.toml"
      ]
    },
    "pull_request": {
      "paths": [
        "**/Cargo.toml",
        "**/Cargo.lock",
        ".cargo/audit.toml"
      ]
    }
  },
  "jobs": {
    "audit": {
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "uses": "actions/checkout@v7"
        },
        {
          "uses": "rustsec/audit-check@v2.0.0",
          "with": {
            "token": "${{ secrets.GITHUB_TOKEN }}",
            "ignore": "RUSTSEC-2025-0141"
          }
        }
      ]
    }
  }
}
